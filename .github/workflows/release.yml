name: Release

# On a version tag: build the plugin component, verify it is a real component,
# generate the changelog from the commit history, and attach both to a GitHub
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  component:
    name: build component
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the changelog is generated from the commits
      # between the previous version tag and this one, which a shallow clone
      # cannot see at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2-release

      # `pumpkin-plugin-api` is a git-tag dependency, so the Pumpkin API is
      # fetched by cargo itself. Only the tag itself is asserted here.
      - name: Check pinned Pumpkin API
        run: |
          set -euo pipefail
          grep -E '^\s*pumpkin-plugin-api\s*=' crates/plasmo-voice-plugin/Cargo.toml

      # wasm32-wasip2 already emits a component, so this is a plain build.
      # (`cargo-component` 0.21.1 cannot decode its own wit-bindgen 0.62 output.)
      #
      # `--locked` like CI: the lockfile pins the exact Pumpkin API commit the git
      # tag resolves to, so a release must not silently re-resolve to another one.
      - name: Build component
        run: cargo build --locked --target wasm32-wasip2 -p plasmo-voice-plugin --release

      - name: Verify component shape
        run: |
          set -euo pipefail
          wasm=target/wasm32-wasip2/release/plasmo_voice_plugin.wasm
          if [ ! -f "$wasm" ]; then
            echo "::error title=No component produced::cargo build emitted no $wasm"
            exit 1
          fi
          python3 - "$wasm" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read(8)
          assert data[:4] == b"\x00asm", f"not a wasm binary: {data[:4]!r}"
          layer = int.from_bytes(data[4:6], "little")
          assert layer == 0x0d, (
              f"expected a component (layer 0x0d), got layer 0x{layer:04x}; "
              "the host rejects core modules"
          )
          print(f"verified: component-model layer 0x{layer:04x}")
          PY

      - name: Stage artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wasm32-wasip2/release/plasmo_voice_plugin.wasm dist/plasmo-voice.wasm
          ls -l dist

      # The changelog is built from the commit history, not written by hand.
      #
      # GitHub's own `generate_release_notes` is not used: it lists *merged pull
      # requests*, and this repository lands commits directly on `main`, so it
      # would produce nothing but a compare link. The subjects are conventional
      # commits (AGENTS.md §8), which is what makes the grouping below work — so
      # the subject is the changelog line, and it is published verbatim.
      - name: Generate changelog
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            target="${GITHUB_REF_NAME}"
            prev="$(git describe --tags --abbrev=0 --match 'v*' "${target}^" 2>/dev/null || true)"
          else
            # Manual dry run: everything since the newest version tag.
            target="$(git rev-parse --short HEAD)"
            prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          fi

          if [ -n "$prev" ]; then
            range="${prev}..${target}"
            compare="**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          else
            # First release: no previous tag to compare against, so list the
            # whole history reachable from the tag instead of nothing.
            range="${target}"
            compare=""
          fi
          echo "collecting commits from: ${range}"

          # Strip the UTF-8 BOM a couple of the early commits carry, or their
          # subjects would fall through to "Other".
          subjects="$(git log --no-merges --pretty=format:'%s' "$range" | sed 's/^\xEF\xBB\xBF//')"

          # Read the pinned API out of the manifest rather than repeating it
          # here, so the notes cannot fall out of step with the build.
          api="$(grep -E '^\s*pumpkin-plugin-api\s*=' crates/plasmo-voice-plugin/Cargo.toml \
            | sed -nE 's/.*tag = "([^"]+)".*/\1/p' | head -n1)"
          [ -n "$api" ] || api='(see crates/plasmo-voice-plugin/Cargo.toml)'

          body=dist/CHANGELOG.md
          {
            printf 'Plasmo Voice\u2013compatible voice server, built as a Pumpkin WASM component.\n\n'
            printf '**Install:** drop `plasmo-voice.wasm` into the server `plugins/` directory.\n'
            printf 'The plugin needs `network.udp.bind`, a send permission\n'
            printf '(`network.udp.connect` / `network.udp` / `network.outbound`) and\n'
            printf '`fs.read.data` + `fs.write.data`; the server config must keep\n'
            printf '`plugins.loopback_only = false`.\n\n'
            printf 'Built against the pinned Pumpkin API `%s`.\n' "$api"
            if [ -n "$prev" ]; then
              printf '\nChanges since `%s`:\n' "$prev"
            else
              printf '\nFirst release.\n'
            fi
            printf '\n'
          } > "$body"

          group() {
            local title="$1" pattern="$2" matches
            matches="$(printf '%s\n' "$subjects" | grep -E "$pattern" || true)"
            [ -n "$matches" ] || return 0
            printf '### %s\n\n' "$title"
            printf '%s\n' "$matches" | sed 's/^/- /'
            printf '\n'
          }

          # Anything that is not a conventional commit, so a stray subject shows
          # up in the notes instead of being silently dropped.
          other() {
            local matches
            matches="$(printf '%s\n' "$subjects" \
              | grep -vE '^(feat|fix|perf|refactor|docs|test|chore|ci|build|style)(\(|:|!)' || true)"
            [ -n "$matches" ] || return 0
            printf '### Other\n\n'
            printf '%s\n' "$matches" | sed 's/^/- /'
            printf '\n'
          }

          {
            group 'Features'           '^feat(\(|:|!)'
            group 'Fixes'              '^fix(\(|:|!)'
            group 'Performance'        '^perf(\(|:|!)'
            group 'Refactoring'        '^refactor(\(|:|!)'
            group 'Documentation'      '^docs(\(|:|!)'
            group 'Tests'              '^test(\(|:|!)'
            group 'Maintenance and CI' '^(chore|ci|build|style)(\(|:|!)'
            other
          } >> "$body"

          if [ -n "$compare" ]; then
            printf '%s\n' "$compare" >> "$body"
          fi

          echo '--- generated changelog ---'
          cat "$body"
          echo '---------------------------'

      - uses: actions/upload-artifact@v4
        with:
          name: plasmo-voice-component
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plasmo-voice.wasm
          body_path: dist/CHANGELOG.md
