name: Release

# On a version tag: build the plugin component, verify it is a real component,
# and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  component:
    name: build component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2-release

      # `pumpkin-plugin-api` is a git-tag dependency, so the Pumpkin API is
      # fetched by cargo itself. Only the tag itself is asserted here.
      - name: Check pinned Pumpkin API
        run: |
          set -euo pipefail
          grep -E '^\s*pumpkin-plugin-api\s*=' crates/plasmo-voice-plugin/Cargo.toml

      # wasm32-wasip2 already emits a component, so this is a plain build.
      # (`cargo-component` 0.21.1 cannot decode its own wit-bindgen 0.62 output.)
      #
      # `--locked` like CI: the lockfile pins the exact Pumpkin API commit the git
      # tag resolves to, so a release must not silently re-resolve to another one.
      - name: Build component
        run: cargo build --locked --target wasm32-wasip2 -p plasmo-voice-plugin --release

      - name: Verify component shape
        run: |
          set -euo pipefail
          wasm=target/wasm32-wasip2/release/plasmo_voice_plugin.wasm
          if [ ! -f "$wasm" ]; then
            echo "::error title=No component produced::cargo build emitted no $wasm"
            exit 1
          fi
          python3 - "$wasm" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read(8)
          assert data[:4] == b"\x00asm", f"not a wasm binary: {data[:4]!r}"
          layer = int.from_bytes(data[4:6], "little")
          assert layer == 0x0d, (
              f"expected a component (layer 0x0d), got layer 0x{layer:04x}; "
              "the host rejects core modules"
          )
          print(f"verified: component-model layer 0x{layer:04x}")
          PY

      - name: Stage artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wasm32-wasip2/release/plasmo_voice_plugin.wasm dist/plasmo-voice.wasm
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: plasmo-voice-component
          path: dist/plasmo-voice.wasm
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plasmo-voice.wasm
          generate_release_notes: true
          body: |
            Plasmo Voice–compatible voice server, built as a Pumpkin WASM component.

            **Install:** drop `plasmo-voice.wasm` into the server's `plugins/` directory.
            The plugin needs `network.udp.bind`, a send permission
            (`network.udp.connect` / `network.udp` / `network.outbound`), and
            `fs.read.data` + `fs.write.data`; and the server config must keep
            `plugins.loopback_only = false`.

            Built against the pinned Pumpkin API `0.2.0+26.3-26.51`.
